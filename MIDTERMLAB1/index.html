<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameSpot · Hyper Scraper</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --accent: #ec4899;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text: #f8fafc;
        }

        body { 
            background: radial-gradient(circle at top right, #1e1b4b, #0f172a);
            font-family: 'Inter', sans-serif; 
            color: var(--text);
            line-height: 1.5; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Animated Header */
        .app-header { 
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border-bottom: 2px solid var(--primary);
            padding: 1.5rem 2rem;
            text-align: center;
        }
        .app-header h1 { 
            font-weight: 800; 
            font-size: 2rem;
            text-transform: uppercase;
            background: linear-gradient(to right, #6366f1, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex; 
            align-items: center; 
            justify-content: center;
            gap: 15px;
        }

        .container { max-width: 1300px; margin: 2rem auto; padding: 0 2rem; flex: 1; width: 100%; }

        /* Scrape Control Card */
        .control-card { 
            background: var(--card-bg); 
            border-radius: 24px; 
            padding: 3rem; 
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); 
            margin-bottom: 2.5rem; 
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        /* Neon Glow Button */
        .scrape-btn {
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            padding: 1.2rem 3rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .scrape-btn:hover { 
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(168, 85, 247, 0.6);
        }
        .scrape-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .status-line {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 1rem 2rem;
            font-size: 0.95rem;
            border: 1px solid var(--accent);
            color: var(--accent);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            margin-top: 2rem;
            font-family: 'JetBrains Mono', monospace;
            opacity: 0;
            transition: opacity 0.5s;
        }

        /* Gradient Table Styles */
        .table-container { 
            background: var(--card-bg); 
            border-radius: 20px; 
            border: 1px solid rgba(255,255,255,0.05);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        table { width: 100%; border-collapse: collapse; min-width: 950px; }
        th { 
            background: rgba(15, 23, 42, 0.8);
            font-size: 0.8rem; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            padding: 1.2rem 1rem; 
            color: #94a3b8;
            border-bottom: 2px solid var(--primary);
            text-align: left;
        }
        td { 
            padding: 1.2rem 1rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.9rem; 
        }
        
        tr:hover td { background: rgba(255,255,255,0.02); }

        .game-link { 
            color: #38bdf8; 
            text-decoration: none; 
            font-weight: 600; 
            padding: 4px 8px;
            border-radius: 4px;
            background: rgba(56, 189, 248, 0.1);
            transition: 0.2s; 
        }
        .game-link:hover { 
            background: var(--primary);
            color: white;
            text-decoration: none;
        }

        .badge-year { background: #1e293b; color: #fbbf24; padding: 2px 8px; border-radius: 6px; border: 1px solid #fbbf24; font-size: 0.75rem; }
        .platform-tag { color: #cbd5e1; font-style: italic; }

        .footer { padding: 2rem; text-align: center; color: #64748b; font-size: 0.85rem; }
    </style>
</head>
<body>
    <header class="app-header">
        <h1>⚡ GameSpot Hyper-Scraper ⚡</h1>
    </header>

    <div class="container">
        <div class="control-card">

            <div class="status-line" id="statusLine">

                        <th>🏭 Developer</th>
                        <th>📦 Publisher</th>

                </thead>

                    <tr><td colspan="6" style="text-align:center; padding:5rem; color:#64748b; font-style: italic;">
                        Waiting for user command to parse GameSpot database...
                    </td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer class="footer">
        &copy; 2026 · <span style="color: var(--accent);">Vibrant Edition</span> · Encrypted Data Engine
    </footer>

</body>
</html>
